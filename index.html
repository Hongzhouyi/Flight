<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Booking</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a href="#" class="active">Book</a>
      <a href="#">Manage</a>
      <a href="#">About us</a>
      <a href="#">My Account</a>
    </nav>
  </header>

  <main class="page">
    <section class="search-panel">
      <h1>Search Flights</h1>

      <form id="search-form" class="search-form">
        <label>
          From
          <input type="text" id="from" placeholder="e.g. London" />
        </label>

        <label>
          To
          <input type="text" id="to" placeholder="e.g. Paris" />
        </label>

        <label>
          Depart
          <input type="date" id="departDate" />
        </label>

        <label>
          Return
          <input type="date" id="returnDate" />
        </label>

        <label>
          Cabin Class
          <select id="cabinClass">
            <option value="">Any</option>
            <option value="Economy">Economy</option>
            <option value="Business">Business</option>
            <option value="First">First</option>
          </select>
        </label>

        <label>
          Passengers
          <input type="number" id="passengers" min="1" value="1" />
        </label>

        <button type="submit">Search</button>
      </form>
    </section>

    <section class="results-panel">
      <div class="results-header">
        <h2>Search Results</h2>
        <select id="sort" disabled>
          <option>Sort (later)</option>
        </select>
      </div>

      <div id="selected-flight" class="selected-flight hidden">
        <h3>Selected Flight</h3>
        <p id="selected-flight-text"></p>
      </div>

      <div id="results">
        <p class="empty-state">No flights loaded yet.</p>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
